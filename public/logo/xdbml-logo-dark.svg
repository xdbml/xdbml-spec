<?xml version="1.0" encoding="UTF-8"?>
<!--
  xDBML logo — dark-mode variant
  Apache License 2.0
  Variant C design with inverted palette for dark backgrounds.
  No background fill (genuinely transparent).
  Tight viewBox: snaps to content bounds.

  Note: faint closing-brace curve uses higher opacity (0.55) than the
  light-mode version (0.40) to remain visible against dark backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 26" role="img" aria-label="xDBML">

  <!-- Mark -->
  <g transform="translate(0, 0)">
    <path d="M 7,1 C 5,1 4,3 4,5 L 4,10 C 4,11 3.5,12 2,12 C 3.5,12 4,13 4,14 L 4,19 C 4,21 5,23 7,23"
          stroke="#e8f4fa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="10" cy="12" r="2.3" fill="#e8f4fa"/>

    <path d="M 13,12 Q 19,12 23,4"   stroke="#e8f4fa" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 13,12 L 25,12"        stroke="#e8f4fa" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 13,12 Q 19,12 23,20"  stroke="#e8f4fa" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <circle cx="23" cy="4"  r="2.3" fill="#5fc2e8"/>
    <circle cx="25" cy="12" r="2.3" fill="#5fc2e8"/>
    <circle cx="23" cy="20" r="2.3" fill="#5fc2e8"/>

    <path d="M 21.5,4 Q 25,6 25,9 L 25,12"    stroke="#5fc2e8" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 25,12 L 25,15 Q 25,18 21.5,20" stroke="#5fc2e8" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Wordmark with uniform inter-letter spacing -->
  <text x="34" y="22" font-family="'Inter', 'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif"
        font-weight="600" font-size="22">
    <tspan fill="#5fc2e8" font-style="italic">x</tspan><tspan fill="#e8f4fa">DBML</tspan>
  </text>

</svg>
