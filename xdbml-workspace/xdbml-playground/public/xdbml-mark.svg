<?xml version="1.0" encoding="UTF-8"?>
<!--
  xDBML mark — icon only, square aspect ratio
  Apache License 2.0
  Variant C design at icon scale.
  Use for: favicon (larger sizes), GitHub avatar, social card, app icon.

  Designed at 64x64 viewBox with adequate padding for round-cropping.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="xDBML mark">

  <!-- Background: rounded square for app-icon contexts -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#1a4d7a"/>

  <!-- Mark, centered and scaled up to fill the icon -->
  <g transform="translate(14, 19)">
    <!-- Opening brace { -->
    <path d="M 7,3 C 4,3 3,5 3,8 L 3,12 C 3,14 2,15 0,15 C 2,15 3,16 3,18 L 3,22 C 3,25 4,27 7,27"
          stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Schema source point -->
    <circle cx="10" cy="15" r="2.8" fill="#ffffff"/>

    <!-- Three branches fanning out -->
    <path d="M 13,15 Q 23,15 30,4"   stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 13,15 L 33,15"        stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 13,15 Q 23,15 30,26"  stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Three target dots in accent color -->
    <circle cx="31" cy="4"  r="2.8" fill="#5fc2e8"/>
    <circle cx="33" cy="15" r="2.8" fill="#5fc2e8"/>
    <circle cx="31" cy="26" r="2.8" fill="#5fc2e8"/>

    <!-- Faint closing-brace curve, higher opacity for visibility on dark background -->
    <path d="M 28,4 Q 33,7 33,11 L 33,15"   stroke="#5fc2e8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 33,15 L 33,19 Q 33,23 28,26" stroke="#5fc2e8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

</svg>
