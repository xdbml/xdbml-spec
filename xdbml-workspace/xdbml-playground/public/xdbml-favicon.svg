<?xml version="1.0" encoding="UTF-8"?>
<!--
  xDBML favicon — centered, simplified for tiny sizes (16x16, 32x32)
  Apache License 2.0
  Variant C design simplified for favicon scale.

  Glyph spans roughly 19 units horizontally (x=4 to x=23 in earlier draft).
  Centered within the 32x32 canvas by shifting right by ~3 units, so the
  glyph now spans x=6 to x=25, with equal margins on left and right.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="xDBML">
  <rect x="0" y="0" width="32" height="32" rx="4" fill="#1a4d7a"/>

  <!-- Opening brace { -->
  <path d="M 9,7 C 7,7 6,8 6,10 L 6,14 C 6,15 5.5,15.5 4.5,15.5
           C 5.5,16.5 6,17 6,18 L 6,22 C 6,24 7,25 9,25"
        stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Source dot -->
  <circle cx="11" cy="16" r="2" fill="#ffffff"/>

  <!-- Three short branches to target dots -->
  <line x1="13" y1="16" x2="22" y2="8"  stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="16" x2="24" y2="16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="16" x2="22" y2="24" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Target dots -->
  <circle cx="23" cy="8"  r="2" fill="#5fc2e8"/>
  <circle cx="25" cy="16" r="2" fill="#5fc2e8"/>
  <circle cx="23" cy="24" r="2" fill="#5fc2e8"/>
</svg>
