<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/xdbml-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The playground controls its own light and dark themes. `only light`
      is the no-JS default and, via the `only` keyword, forbids the
      browser from force-darkening the page (a plain `light`/`light dark`
      does not stop Chrome's Auto Dark Theme, which mangles the ERD SVG).
      The pre-paint bootstrap below overrides this inline on <html> with
      `only light` / `only dark` to match the resolved mode, so the meta
      is just the fallback when scripting is off.
    -->
    <meta name="color-scheme" content="only light" />
    <!--
      Appearance bootstrap. Runs before first paint so the page never
      flashes the wrong theme. Precedence:
        1. URL ?theme=light|dark  -- the hand-off from xdbml.org; it wins,
           is persisted, and is then stripped from the URL.
        2. localStorage           -- a direct/standalone open reuses the
           last chosen mode.
        3. prefers-color-scheme   -- otherwise follow the OS.
      Kept as a classic inline script (not a module) so it executes during
      head parsing, ahead of the deferred app bundle. Mirrors the contract
      in src/composables/useAppearance.ts (same key, same `dark` class).
    -->
    <script>
      (function () {
        try {
          var KEY = 'xdbml-playground:appearance';
          var url = new URL(window.location.href);
          var param = url.searchParams.get('theme');
          var mode = null;
          if (param === 'light' || param === 'dark') {
            mode = param;
            try { localStorage.setItem(KEY, mode); } catch (e) {}
            url.searchParams.delete('theme');
            window.history.replaceState(null, '', url.pathname + url.search + url.hash);
          } else {
            try {
              var stored = localStorage.getItem(KEY);
              if (stored === 'light' || stored === 'dark') mode = stored;
            } catch (e) {}
          }
          if (!mode) {
            mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          // `only` forbids the browser from force-darkening (or -lightening)
          // our page: without it, Chrome's Auto Dark Theme repaints the app
          // and mangles the ERD SVG. We control both themes ourselves.
          root.style.colorScheme = 'only ' + mode;
        } catch (e) { /* leave default light on any failure */ }
      })();
    </script>
    <title>xDBML Playground</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
