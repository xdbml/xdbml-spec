# playground/help/help-menu.toml
#
# Help menu structure for the playground.
#
# Each node has:
#   - title:    label shown in the sidebar
#   - slug:     URL component pointing to <slug>.md (optional --
#               nodes without a slug are pure section headers that
#               group children but aren't themselves a page)
#   - children: nested nodes (optional, any depth)
#
# A node may have both a slug AND children: clicking the label
# navigates to that page; clicking the disclosure triangle toggles
# the children. Mixed-mode nodes are useful for section landing pages
# that also list sub-topics.
#
# Slugs are stable identifiers. Once a page is published, its slug
# never changes -- the menu can be reorganized freely without breaking
# any external link. If a page ever needs to be retired, set up a
# redirect from the old slug to the new one rather than deleting.


